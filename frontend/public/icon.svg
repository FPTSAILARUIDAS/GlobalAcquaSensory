<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0369a1" rx="80"/>
  
  <!-- Water Drop Shape -->
  <path d="M256 80 C200 180, 160 220, 160 290 C160 350, 200 400, 256 400 C312 400, 352 350, 352 290 C352 220, 312 180, 256 80 Z" 
        fill="#38bdf8" 
        stroke="#06b6d4" 
        stroke-width="4"
        opacity="0.95"/>
  
  <!-- Inner Highlight -->
  <ellipse cx="230" cy="240" rx="35" ry="55" fill="#e0f2fe" opacity="0.6"/>
  
  <!-- Sensory Test Lines (representing evaluation criteria) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <!-- Left side lines (checkmarks) -->
    <polyline points="120,160 135,175 155,145" fill="none"/>
    <polyline points="120,220 135,235 155,205" fill="none"/>
    <polyline points="120,280 135,295 155,265" fill="none"/>
    
    <!-- Right side lines (checkmarks) -->
    <polyline points="357,160 372,175 392,145" fill="none"/>
    <polyline points="357,220 372,235 392,205" fill="none"/>
    <polyline points="357,280 372,295 392,265" fill="none"/>
  </g>
  
  <!-- Bottom Text Badge -->
  <rect x="156" y="420" width="200" height="50" rx="25" fill="#1e40af" opacity="0.9"/>
  <text x="256" y="452" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle">ACQUA</text>
</svg>
